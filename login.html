<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENCO (Entry CKG Otomatis) v1.0.0 - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-neon: #00f0ff;
      --primary-cyan: #00d4ff;
      --primary-magenta: #ff007f;
      --accent-purple: #8b5cf6;
      --dark-bg: #030712;
      --card-bg: rgba(11, 18, 33, 0.82);
      --input-bg: rgba(7, 13, 26, 0.78);
      --border-glow: rgba(0, 212, 255, 0.32);
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--dark-bg);
      background-image: 
        radial-gradient(ellipse at 50% 0%, #0d1e38 0%, #040814 65%, #02040a 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* ── Ambient Glowing Lights ────────────────────────────────── */
    .ambient-light {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(80px);
    }

    .ambient-cyan {
      width: 320px;
      height: 320px;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(0, 240, 255, 0.22) 0%, rgba(0, 212, 255, 0.05) 60%, transparent 75%);
      animation: cyanPulse 5s ease-in-out infinite alternate;
    }

    .ambient-magenta {
      width: 280px;
      height: 280px;
      bottom: -60px;
      right: 10%;
      background: radial-gradient(circle, rgba(255, 0, 127, 0.16) 0%, rgba(139, 92, 246, 0.05) 60%, transparent 75%);
      animation: magentaFloat 7s ease-in-out infinite alternate;
    }

    @keyframes cyanPulse {
      0% { transform: translateX(-50%) scale(0.92); opacity: 0.7; }
      100% { transform: translateX(-50%) scale(1.15); opacity: 1; }
    }

    @keyframes magentaFloat {
      0% { transform: translate(0, 0) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-20px, -20px) scale(1.1); opacity: 0.95; }
    }

    /* ── Cyberpunk Glassmorphic Login Card ─────────────────────── */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 0 16px;
    }

    .login-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 22px;
      padding: 30px 26px 26px 26px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(0, 212, 255, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(24px) saturate(180%);
      text-align: center;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Top Glowing Accent Line */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-neon) 40%, var(--primary-magenta) 75%, transparent);
      box-shadow: 0 0 14px var(--primary-neon), 0 0 20px var(--primary-magenta);
      border-radius: 2px;
    }

    /* ── Logo & Header Section ─────────────────────────────────── */
    .brand-section {
      margin-bottom: 22px;
    }

    .logo-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      margin-bottom: 12px;
    }

    .logo-glow-ring {
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.5), rgba(255, 0, 127, 0.35));
      filter: blur(8px);
      opacity: 0.8;
      animation: ringGlow 3s ease-in-out infinite alternate;
    }

    @keyframes ringGlow {
      0% { opacity: 0.6; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1.04); }
    }

    .logo-img {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 16px;
      border: 1.5px solid rgba(0, 240, 255, 0.7);
      background: #091222;
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.4);
      display: block;
      object-fit: cover;
    }

    .brand-title {
      font-family: 'Orbitron', 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1.1;
      background: linear-gradient(180deg, #ffffff 35%, #93eaff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
      margin-bottom: 4px;
    }

    .brand-subtitle-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 5px;
      height: 5px;
      background: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 6px #00f0ff;
    }

    /* ── Form Controls ─────────────────────────────────────────── */
    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: color 0.2s ease, filter 0.2s ease;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 11px 40px 11px 40px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-input:focus {
      border-color: var(--primary-neon);
      background: rgba(10, 18, 35, 0.95);
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.35), inset 0 0 8px rgba(0, 212, 255, 0.1);
    }

    .form-input:focus ~ .input-icon,
    .form-group:focus-within .input-icon {
      color: var(--primary-neon);
      filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.7));
    }

    .form-input::placeholder {
      color: #475569;
      font-weight: 500;
    }

    /* Eye Toggle Password Button */
    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .toggle-pwd:hover {
      color: var(--primary-neon);
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.8));
    }

    /* ── Submit Button ─────────────────────────────────────────── */
    .btn-submit {
      margin-top: 18px;
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, #00f0ff 0%, #0284c7 60%, #1d4ed8 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #040814;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 22px rgba(0, 212, 255, 0.45), 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(0, 240, 255, 0.7), 0 0 15px rgba(0, 240, 255, 0.5);
      filter: brightness(1.08);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 14px rgba(0, 212, 255, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      filter: grayscale(0.3);
      transform: none;
    }

    .btn-arrow {
      transition: transform 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) .btn-arrow {
      transform: translateX(3px);
    }

    /* ── Alert Error Box ───────────────────────────────────────── */
    .alert-box {
      display: none;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 14px;
      text-align: left;
      line-height: 1.45;
      animation: alertPopIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
    }

    @keyframes alertPopIn {
      0% { opacity: 0; transform: translateY(-8px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Remember Me Checkbox ─────────────────────────────────── */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    .checkbox-remember-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      transition: all 0.2s ease;
    }

    .checkbox-remember-container:hover {
      color: #00f0ff;
    }

    .checkbox-remember-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .checkbox-remember-custom {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
    }

    .checkbox-remember-input:checked + .checkbox-remember-custom {
      background: linear-gradient(135deg, #00f0ff, #0099ff);
      border-color: #00f0ff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.6);
    }

    .checkbox-remember-custom .check-icon {
      stroke: #030712;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .checkbox-remember-input:checked + .checkbox-remember-custom .check-icon {
      opacity: 1;
      transform: scale(1);
    }

    .checkbox-remember-container:hover .checkbox-remember-custom {
      border-color: #00f0ff;
    }

    /* ── Footer Attribution ──────────────────────────────────── */
    .login-security-chip {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10.5px;
      color: #64748b;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .security-icon {
      color: #00f0ff;
      font-size: 8px;
      filter: drop-shadow(0 0 4px #00f0ff);
    }

    /* ── Orbital Spinner ───────────────────────────────────────── */
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(4, 8, 20, 0.25);
      border-top-color: #040814;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Ambient Cyber Lighting -->
  <div class="ambient-light ambient-cyan"></div>
  <div class="ambient-light ambient-magenta"></div>

  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Brand & Title Header -->
      <div class="brand-section">
        <div class="logo-container">
          <div class="logo-glow-ring"></div>
          <img src="assets/icon.png" alt="ENCO" class="logo-img">
        </div>
        <h1 class="brand-title">ENCO</h1>
        <div class="brand-subtitle-badge">
          <span class="badge-dot"></span>
          <span>ENTRY CKG OTOMATIS v1.0.0</span>
        </div>
      </div>

      <!-- Error Alert Box -->
      <div id="error-alert" class="alert-box alert-error"></div>

      <!-- Main Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username Petugas</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <!-- User SVG Icon -->
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              class="form-input" 
              placeholder="Masukkan username akun..." 
              required 
              autocomplete="username"
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <!-- Lock SVG Icon -->
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="Masukkan password akun..." 
              required 
              autocomplete="current-password"
            >
            <button type="button" id="toggle-pwd" class="toggle-pwd" title="Lihat password" aria-label="Toggle password">
              <!-- Eye SVG Icon -->
              <svg id="eye-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Opsi Ingat Saya (Remember Me) -->
        <div class="form-options">
          <label class="checkbox-remember-container">
            <input type="checkbox" id="remember-me" class="checkbox-remember-input">
            <span class="checkbox-remember-custom">
              <svg class="check-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
            <span class="checkbox-label-text">Ingat Saya</span>
          </label>
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">
          <div class="spinner" id="btn-spinner"></div>
          <span id="btn-text">MASUK APLIKASI</span>
          <svg class="btn-arrow" id="btn-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Footer Attribution -->
      <div class="login-security-chip">
        <span class="security-icon">●</span>
        <span>Create by: Mochamad Fauzie, S.Gz @2026</span>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePwdBtn = document.getElementById('toggle-pwd');
    const eyeIcon = document.getElementById('eye-icon');
    const rememberMeCheckbox = document.getElementById('remember-me');
    const btnSubmit = document.getElementById('btn-submit');
    const btnSpinner = document.getElementById('btn-spinner');
    const btnText = document.getElementById('btn-text');
    const btnArrow = document.getElementById('btn-arrow');
    const errorAlert = document.getElementById('error-alert');

    // Muat kredensial yang tersimpan di localStorage jika fitur 'Ingat Saya' pernah dicentang
    try {
      const savedUser = localStorage.getItem('enco_saved_username');
      const savedPwd = localStorage.getItem('enco_saved_password');
      if (savedUser && savedPwd) {
        usernameInput.value = savedUser;
        passwordInput.value = savedPwd;
        rememberMeCheckbox.checked = true;
      } else if (savedUser) {
        usernameInput.value = savedUser;
      }
    } catch (e) {
      console.warn('[login] Gagal memuat data tersimpan:', e);
    }

    // Toggle Password Visibility dengan SVG Icon dinamis
    let isPwdVisible = false;
    togglePwdBtn.addEventListener('click', () => {
      isPwdVisible = !isPwdVisible;
      passwordInput.type = isPwdVisible ? 'text' : 'password';
      if (isPwdVisible) {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.style.display = 'block';
    }

    function clearError() {
      errorAlert.textContent = '';
      errorAlert.style.display = 'none';
    }

    function setLoading(isLoading) {
      btnSubmit.disabled = isLoading;
      btnSpinner.style.display = isLoading ? 'inline-block' : 'none';
      btnArrow.style.display = isLoading ? 'none' : 'inline-block';
      btnText.textContent = isLoading ? 'MEMVALIDASI AKUN...' : 'MASUK APLIKASI';
    }

    // Submit Form Login ke Cloudflare D1
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      setLoading(true);

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const rememberMe = rememberMeCheckbox.checked;

      // Kelola simpanan lokal: jika dicentang simpan, jika tidak dicentang hapus
      try {
        if (rememberMe) {
          localStorage.setItem('enco_saved_username', username);
          localStorage.setItem('enco_saved_password', password);
        } else {
          localStorage.removeItem('enco_saved_username');
          localStorage.removeItem('enco_saved_password');
        }
      } catch (e) {
        console.warn('[login] Gagal mengakses localStorage:', e);
      }

      try {
        if (window.electronAPI?.loginWithD1) {
          const res = await window.electronAPI.loginWithD1(username, password, rememberMe);
          if (!res.success) {
            throw new Error(res.message || 'Username atau password salah.');
          }
          // Login sukses ditangani otomatis oleh Electron Main process
        } else {
          showError('Antarmuka Electron API tidak terdeteksi.');
        }
      } catch (err) {
        showError(err.message || 'Gagal memvalidasi ke database.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
