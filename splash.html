<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENCO - Memeriksa Pembaruan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .splash-card {
      width: 440px;
      height: 280px;
      background: linear-gradient(145deg, rgba(13, 19, 33, 0.95), rgba(7, 10, 18, 0.98));
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 
                  0 0 35px rgba(6, 182, 212, 0.22),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 24px 20px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      -webkit-app-region: drag; /* Memungkinkan splash di-drag jika mau */
    }

    /* Ambient background neon glow */
    .ambient-glow {
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.3) 0%, rgba(16, 185, 129, 0.1) 50%, transparent 80%);
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(30px);
      pointer-events: none;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.5; transform: translateX(-50%) scale(0.9); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    }

    /* Header & Icon */
    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .icon-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-glow-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #06b6d4, #10b981, #3b82f6, #06b6d4);
      animation: spinRing 4s linear infinite;
      opacity: 0.8;
      filter: blur(4px);
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .icon-img {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background: #0f172a;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #38bdf8 0%, #22c55e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #67e8f9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .app-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      font-weight: 500;
    }

    /* Status & Progress */
    .progress-section {
      width: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #cbd5e1;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 80%;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: blinkDot 1.4s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .status-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .percent-text {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      font-family: monospace;
    }

    /* Glowing Progress Bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #06b6d4, #10b981);
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.7);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Footer */
    .footer-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 8px;
      z-index: 2;
    }

    .repo-tag {
      color: #0ea5e9;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="ambient-glow"></div>

    <div class="header-content">
      <div class="icon-wrapper">
        <div class="icon-glow-ring"></div>
        <img class="icon-img" src="assets/icon.png" alt="ENCO Logo" onerror="this.style.display='none'">
      </div>

      <div class="title-row">
        <div class="app-title">ENCO AUTOMATION</div>
        <div class="version-badge">AUTO-SYNC</div>
      </div>
      <div class="app-sub">Entry CKG Otomatis - Sehat Indonesiaku</div>
    </div>

    <div class="progress-section">
      <div class="status-row">
        <div class="status-left">
          <div class="pulse-dot" id="pulseDot"></div>
          <div class="status-text" id="statusText">Memulai sistem...</div>
        </div>
        <div class="percent-text" id="percentText">0%</div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="footer-row">
      <span>Auto Differential Update</span>
      <span class="repo-tag">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        bankot18/kunkun
      </span>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('statusText');
    const percentText = document.getElementById('percentText');
    const progressFill = document.getElementById('progressFill');

    function updateProgress(message, percent = 0) {
      if (message) {
        statusText.textContent = message;
      }
      const clampedPercent = Math.max(0, Math.min(100, Math.round(percent)));
      percentText.textContent = `${clampedPercent}%`;
      progressFill.style.width = `${clampedPercent}%`;
    }

    if (window.splashAPI && typeof window.splashAPI.onStatusUpdate === 'function') {
      window.splashAPI.onStatusUpdate((data) => {
        if (data) {
          updateProgress(data.text, data.percent);
        }
      });
    } else {
      // Fallback animasi jika dibuka langsung di browser
      let p = 10;
      updateProgress('Memeriksa pembaruan...', p);
    }
  </script>
</body>
</html>
